# GoReleaser configuration for Ohm
# https://goreleaser.com
version: 2

project_name: ohm

before:
  hooks:
    - go mod tidy

builds:
  - id: ohm
    main: ./cmd/ohm
    binary: ohm
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: linux
        formats: [tar.gz]
      - goos: darwin
        formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - COMMERCIAL-LICENSE.md
      - THIRD-PARTY-NOTICES.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "🚀 New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "🧰 Maintenance"
      regexp: "^.*chore[(\\w)]*:+.*$"
      order: 2
    - title: "Other"
      order: 999

release:
  github:
    owner: derKosi
    name: Ohm
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## ⚡ Ohm v{{.Version}}

    **Resistance against AGI bloat.** Ohm scans your system for AI-related software, shows what's installed and how much space it eats, and generates a reviewable cleanup script. Ohm never deletes anything itself.

    ### Install

    ```bash
    curl -fsSL https://github.com/derKosi/Ohm/releases/latest/download/install.sh | sh
    ```
  extra_files:
    - glob: install.sh
