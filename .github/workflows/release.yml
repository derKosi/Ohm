# Release — triggered by a v* tag. Runs GoReleaser to cross-compile 6 targets
# and publish a GitHub Release with archives + checksums.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required by goreleaser to create the release and upload assets

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so goreleaser can build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
